<header class="header-banner">
  <div class="brand">
    <span class="icon">🎓</span>
    <h1 class="titulo-sistema">Sistema <span>Escolar</span></h1>
  </div>
</header>

<main class="login-wrapper">
  <div class="container">
    <form [formGroup]="formulario" (ngSubmit)="onLogin()" class="formulario">
      <input 
        type="text" 
        formControlName="username" 
        placeholder="Usuario" 
      />
      
      <input 
        type="password" 
        formControlName="password" 
        placeholder="Contraseña" 
      />
      
      <button type="submit" [disabled]="formulario.invalid">
        <span>Ingresar</span>
      </button>
    </form>

    <p *ngIf="mensajeError" class="mensaje-error">
      {{ mensajeError }}
    </p>
  </div>
</main>
