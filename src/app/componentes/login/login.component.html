<div class="container">
  <h2>Iniciar Sesión</h2>

  <form [formGroup]="formulario" (ngSubmit)="onLogin()" class="formulario">
    <input 
      type="text" 
      formControlName="username" 
      placeholder="Usuario" 
    />
    
    <input 
      type="password" 
      formControlName="password" 
      placeholder="Contraseña" 
    />
    
    <button type="submit" [disabled]="formulario.invalid">Ingresar</button>
  </form>

  <p *ngIf="mensajeError" style="color: red; margin-top: 10px;">
    {{ mensajeError }}
  </p>
</div>
