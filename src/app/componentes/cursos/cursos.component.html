<div class="page-container">
  <!-- Tarjeta del Formulario -->
  <div class="card-custom">
    <h2 class="section-title">Gestión de Cursos</h2>

    <form [formGroup]="formulario" (ngSubmit)="guardarCurso()" class="formulario-grid">
      
      <div class="form-group">
        <label for="materiaInput">Materia</label>
        <input 
          type="text" 
          id="materiaInput" 
          placeholder="Ingrese la materia" 
          formControlName="materia">
      </div>

      <div class="form-group">
        <label for="nombreMaestroInput">Nombre del Maestro</label>
        <input 
          type="text" 
          id="nombreMaestroInput" 
          placeholder="Ingrese el nombre del maestro" 
          formControlName="nombreMaestro">
      </div>

      <div class="form-group full-width">
        <label for="numSalonInput">Número de Salón</label>
        <input 
          type="number" 
          id="numSalonInput" 
          placeholder="Ingrese el número de salón" 
          formControlName="numSalon">
      </div>

      <div class="form-actions full-width">
        <button 
          type="submit" 
          class="btn-submit" 
          [disabled]="formulario.invalid">
          <span>Ejecutar</span>
        </button>
      </div>

    </form>
  </div>

  <!-- Tarjeta de la Tabla -->
  <div class="card-custom">
    <h3 class="section-title">Lista de Cursos</h3>

    <div class="table-responsive">
      <table class="tabla-custom">
        <thead>
          <tr>
            <th>Materia</th>
            <th>Maestro</th>
            <th>Salón</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let curso of cursos">
            <td>{{ curso.materia }}</td>
            <td>{{ curso.nombreMaestro }}</td>
            <td>{{ curso.numSalon }}</td>
          </tr>
          <tr *ngIf="!cursos || cursos.length === 0">
            <td colspan="3" class="empty-msg">No hay registros cargados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
