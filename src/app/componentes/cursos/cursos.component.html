<div class="page-container">
  <!-- Tarjeta del Formulario (Root, Preceptor y Administrativo) -->
  <div class="card-custom" *ngIf="puedeCrear">
    <h2 class="section-title">{{ idEdicion !== null ? 'Modificar curso' : 'Gestión de Cursos' }}</h2>

    <form [formGroup]="formulario" (ngSubmit)="guardarCurso()" class="formulario-grid">

      <div class="form-group">
        <label for="materiaInput">Materia</label>
        <input
          type="text"
          id="materiaInput"
          placeholder="Ingrese la materia"
          formControlName="materia">
      </div>

      <div class="form-group">
        <label for="docenteSelect">Docente</label>
        <select id="docenteSelect" formControlName="docenteId">
          <option [ngValue]="null" disabled>Seleccioná un docente</option>
          <option *ngFor="let d of docentes" [ngValue]="d.id">{{ d.apellido }}, {{ d.nombre }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="horarioInput">Horario</label>
        <input
          type="text"
          id="horarioInput"
          placeholder="Ej: Lunes 8:00 a 10:00"
          formControlName="horario">
      </div>

      <div class="form-group">
        <label for="cupoInput">Cupo</label>
        <input
          type="number"
          id="cupoInput"
          placeholder="Cantidad máxima de alumnos"
          formControlName="cupo">
      </div>

      <div class="form-actions full-width">
        <button type="submit" class="btn-submit" [disabled]="formulario.invalid">
          <span>{{ idEdicion !== null ? 'Guardar cambios' : 'Crear curso' }}</span>
        </button>
        <button type="button" class="btn-tabla" *ngIf="idEdicion !== null" (click)="cancelarEdicion()">
          Cancelar
        </button>
      </div>

    </form>
  </div>

  <!-- Tarjeta de la Tabla -->
  <div class="card-custom">
    <h3 class="section-title">{{ esDocente ? 'Mis cursos' : 'Lista de Cursos' }}</h3>
    <p class="solo-lectura" *ngIf="!puedeCrear">Vista de solo lectura</p>

    <div class="table-responsive">
      <table class="tabla-custom">
        <thead>
          <tr>
            <th>Materia</th>
            <th>Docente</th>
            <th>Horario</th>
            <th>Cupo</th>
            <th *ngIf="puedeCrear">Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let curso of cursos">
            <td>{{ curso.materia }}</td>
            <td>{{ curso.nombreMaestro }}</td>
            <td>{{ curso.horario }}</td>
            <td>{{ curso.cupo }}</td>
            <td *ngIf="puedeCrear">
              <div class="acciones">
                <button type="button" class="btn-tabla" (click)="editar(curso)">Modificar</button>
                <button type="button" class="btn-tabla btn-peligro" (click)="eliminar(curso)">Eliminar</button>
              </div>
            </td>
          </tr>
          <tr *ngIf="!cursos || cursos.length === 0">
            <td [attr.colspan]="puedeCrear ? 5 : 4" class="empty-msg">No hay cursos para mostrar.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
