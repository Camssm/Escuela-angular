<div class="container">
  <h1>Gestión de Alumnos</h1>

  <!-- Formulario Reactivo -->
  <div class="row mt-4">
    <form [formGroup]="formulario" (ngSubmit)="guardarAlumno()">

      <!-- Campo Nombre -->
      <div class="form-group mb-3">
        <label for="nombreInput">Nombre</label>
        <input 
          type="text" 
          class="form-control" 
          id="nombreInput" 
          placeholder="Ingrese el nombre" 
          formControlName="nombre">
      </div>

      <!-- Campo Apellido -->
      <div class="form-group mb-3">
        <label for="apellidoInput">Apellido</label>
        <input 
          type="text" 
          class="form-control" 
          id="apellidoInput" 
          placeholder="Ingrese el apellido" 
          formControlName="apellido">
      </div>

      <!-- Campo Email -->
      <div class="form-group mb-3">
        <label for="gmailInput">Correo Electrónico</label>
        <input 
          type="email" 
          class="form-control" 
          id="gmailInput" 
          placeholder="ejemplo@correo.com" 
          formControlName="gmail">
      </div>

      <!-- Botón de Guardar -->
      <button type="submit" class="btn btn-primary" [disabled]="formulario.invalid">
        Ejecutar
      </button>

    </form>
  </div>

  <hr class="my-4" />

  <!-- Tabla del listado -->
  <div class="row mt-2">
    <h3>Lista de Alumnos</h3>
    <table class="table table-striped mt-2">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Gmail</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let alumno of alumnos">
          <td>{{ alumno?.nombre }}</td>
          <td>{{ alumno?.apellido }}</td>
          <td>{{ alumno?.gmail }}</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
