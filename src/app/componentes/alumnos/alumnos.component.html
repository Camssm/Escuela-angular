<div class="page-container">
  <!-- Tarjeta del Formulario -->
  <div class="card-custom">
    <h2 class="section-title">Gestión de Alumnos</h2>

    <form [formGroup]="formulario" (ngSubmit)="guardarAlumno()" class="formulario-grid">
      
      <div class="form-group">
        <label for="nombreInput">Nombre</label>
        <input 
          type="text" 
          id="nombreInput" 
          placeholder="Ingrese el nombre" 
          formControlName="nombre">
      </div>

      <div class="form-group">
        <label for="apellidoInput">Apellido</label>
        <input 
          type="text" 
          id="apellidoInput" 
          placeholder="Ingrese el apellido" 
          formControlName="apellido">
      </div>

      <div class="form-group full-width">
        <label for="gmailInput">Correo Electrónico</label>
        <input 
          type="email" 
          id="gmailInput" 
          placeholder="ejemplo@correo.com" 
          formControlName="gmail">
      </div>

      <div class="form-actions full-width">
        <button 
          type="submit" 
          class="btn-submit" 
          [disabled]="formulario.invalid">
          <span>Ejecutar</span>
        </button>
      </div>

    </form>
  </div>

  <!-- Tarjeta de la Tabla -->
  <div class="card-custom">
    <h3 class="section-title">Lista de Alumnos</h3>

    <div class="table-responsive">
      <table class="tabla-custom">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Gmail</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let alumno of alumnos">
            <td>{{ alumno?.nombre }}</td>
            <td>{{ alumno?.apellido }}</td>
            <td>{{ alumno?.gmail }}</td>
          </tr>
          <tr *ngIf="!alumnos || alumnos.length === 0">
            <td colspan="3" class="empty-msg">No hay alumnos registrados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
