<div class="page-container">
  <!-- Cartão de Formulario -->
  <div class="card-custom">
    <h2 class="section-title">Gestión de Administración</h2>

    <form [formGroup]="formulario" (ngSubmit)="guardarAdministracion()" class="formulario-grid">
      
      <div class="form-group">
        <label for="nombreInput">Nombre</label>
        <input
          type="text"
          id="nombreInput"
          placeholder="Ingrese el nombre"
          formControlName="nombre">
      </div>

      <div class="form-group">
        <label for="apellidoInput">Apellido</label>
        <input
          type="text"
          id="apellidoInput"
          placeholder="Ingrese el apellido"
          formControlName="apellido">
      </div>

      <div class="form-group">
        <label for="dniInput">DNI</label>
        <input
          type="text"
          id="dniInput"
          placeholder="Ingrese el DNI"
          formControlName="dni">
      </div>

      <div class="form-group">
        <label for="emailInput">Correo Electrónico</label>
        <input
          type="email"
          id="emailInput"
          placeholder="ejemplo@correo.com"
          formControlName="email">
      </div>

      <div class="form-group full-width">
        <label for="especialidadInput">Especialidad</label>
        <input
          type="text"
          id="especialidadInput"
          placeholder="Ingrese la especialidad"
          formControlName="especialidad">
      </div>

      <div class="form-actions full-width">
        <button
          type="submit"
          class="btn-submit"
          [disabled]="formulario.invalid">
          <span>Ejecutar</span>
        </button>
      </div>

    </form>
  </div>

  <div class="card-custom">
    <h3 class="section-title">Lista de Administración</h3>

    <div class="table-responsive">
      <table class="tabla-custom">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>DNI</th>
            <th>Email</th>
            <th>Especialidad</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of administraciones">
            <td>{{ item.nombre }}</td>
            <td>{{ item.apellido }}</td>
            <td>{{ item.dni }}</td>
            <td>{{ item.email }}</td>
            <td>{{ item.especialidad }}</td>
          </tr>
          <tr *ngIf="!administraciones || administraciones.length === 0">
            <td colspan="5" class="empty-msg">No hay registros cargados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
